# https://neoforged.net
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${license}"
issueTrackerURL = "${issue_tracker_url}"

[[mods]]
modId = "${name}"
version = "${version}"
displayName = "${project_name}"
updateJSONURL = "${update_json_url}"
displayURL = "${homepage_url}"
logoFile = "${project_name}.png"
credits = "${authors}"
authors = "${authors}"
displayTest = "IGNORE_SERVER_VERSION"
description = '''${project_description}'''

# Forge Dependency
[[dependencies.${ name }]]
modId = "forge"
mandatory = false
type = "optional"
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

# NeoForge Dependency
[[dependencies.${ name }]]
modId = "neoforge"
mandatory = false
type = "optional"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft Dependency
[[dependencies.${ name }]]
modId = "minecraft"
mandatory = true
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# TaterLib Dependency
[[dependencies.${ name }]]
modId = "taterlib"
mandatory = true
type = "required"
versionRange = "[${taterlib_version},)"
ordering = "BEFORE"
side = "SERVER"
